name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Does this change how sudo or authentication behaves?
      description: |
        This plugin hands out root access, so changes to the helper's safety rules
        (who it acts for, authentication, visudo checks, which files it touches)
        need a clear explanation. Say "no" if it doesn't touch any of that.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to open a pull request for this?
      options:
        - "Yes"
        - "Maybe, with some guidance"
        - "No"
